name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "19 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.15"
      - name: Export the committed runtime and development lock
        run: uv export --frozen --extra dev --no-emit-project --no-hashes --output-file audit-requirements.txt
      - name: Audit exact locked versions against the live advisory database
        run: uvx --python 3.11 pip-audit==2.9.0 --strict --desc --disable-pip --no-deps --requirement audit-requirements.txt --format json --output dependency-audit.json
      - name: Retain audit findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
