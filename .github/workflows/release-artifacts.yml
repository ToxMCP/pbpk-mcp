name: Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify contract artifacts are current
        run: |
          python scripts/check_runtime_contract_env.py
          make misuse-prevention-test PY=python
          python scripts/generate_contract_artifacts.py --check
          python scripts/check_release_metadata.py
          python scripts/esqlabs_models.py check-public-tree
          python scripts/validate_model_manifests.py --strict --require-explicit-ngra --curated-publication-set

      - name: Build and validate release artifacts
        run: |
          python scripts/check_distribution_artifacts.py --artifact-dir dist --report-path dist/release-artifact-report.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbpk-release-artifacts-${{ github.ref_name || github.run_id }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/release-artifact-report.json
          if-no-files-found: error
