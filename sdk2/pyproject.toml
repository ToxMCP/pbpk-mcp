[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pbpk-mcp-sdk2"
version = "0.1.0"
description = "Isolated stable MCP SDK2 transport for the existing PBPK MCP backend"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mcp==2.2.0",
  "httpx2>=2.13.1,<3",
  "uvicorn>=0.49,<1",
  "anyio>=4.14.2,<5",
  "pyjwt>=2.15.1,<3",
  "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.28.1,<0.29", "black>=26.3.1,<27"]

[project.scripts]
pbpk-mcp-sdk2-http = "pbpk_mcp_sdk2.main:http_main"
pbpk-mcp-sdk2-stdio = "pbpk_mcp_sdk2.main:stdio_main"

[tool.hatch.build.targets.wheel]
packages = ["src/pbpk_mcp_sdk2"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
